<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test — Regular Japa button</title>
    <style>
      :root {
        --amber-500: #f59e0b;
        --amber-400: #fbbf24;
        --amber-300-70: rgba(252, 211, 77, 0.7);
        --border-amber: rgba(251, 191, 36, 0.55);
        --glow: rgba(245, 158, 11, 0.35);
        --hover-glow: rgba(245, 158, 11, 0.5);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(160deg, #1a0a2e 0%, #2d1b4e 45%, #1e1033 100%);
        color: #fff;
      }
      h1 {
        font-size: 1rem;
        font-weight: 600;
        opacity: 0.85;
        text-align: center;
        max-width: 22rem;
        line-height: 1.5;
      }
      .japa-button {
        width: 100%;
        max-width: 20rem;
        padding: 1rem 1.25rem;
        margin: 0;
        cursor: pointer;
        border-radius: 1rem;
        border: 2px solid var(--border-amber);
        box-shadow: 0 0 30px var(--glow);
        background: var(--amber-500);
        color: #fff;
        font-weight: 700;
        font-size: clamp(1rem, 4vw, 1.25rem);
        line-height: 1.3;
        text-align: center;
        transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s, background 0.2s;
      }
      .japa-button:hover {
        box-shadow: 0 0 40px var(--hover-glow);
        border-color: var(--amber-300-70);
        background: var(--amber-400);
      }
      .japa-button:active {
        transform: scale(0.98);
      }
      .japa-button:focus-visible {
        outline: 2px solid var(--amber-400);
        outline-offset: 3px;
      }
      .note {
        font-size: 0.8rem;
        opacity: 0.65;
        max-width: 22rem;
        text-align: center;
        line-height: 1.45;
      }
      code {
        font-size: 0.85em;
        background: rgba(255, 255, 255, 0.08);
        padding: 0.1em 0.35em;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Isolated test · matches landing primary CTA (max 20rem wide)</h1>

    <button type="button" class="japa-button" id="btn" aria-label="Regular Japa (test)">Regular Japa</button>

    <p class="note">
      Open while <code>npm run dev</code> is running:<br />
      <code>/regular-japa-button-test.html</code><br /><br />
      Styling mirrors <code>src/components/landing/Landing.tsx</code> (begin Japa button).
    </p>

    <script>
      document.getElementById('btn').addEventListener('click', function () {
        console.log('[test] Regular Japa button clicked');
      });
    </script>
  </body>
</html>
