# Manual load test — does not run on every push.
# Repo → Actions → "k6 load test" → Run workflow
name: k6 load test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin (no path), e.g. https://japam.digital'
        required: true
        default: 'https://japam.digital'
      script:
        description: 'Which k6 script'
        required: true
        type: choice
        options:
          - health-smoke.js
          - health-load.js
          - spa-and-api.js
        default: 'health-smoke.js'
      peak_vus:
        description: 'K6_PEAK_VUS (health-load.js only)'
        required: false
        default: '500'

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/${{ github.event.inputs.script }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          K6_PEAK_VUS: ${{ github.event.inputs.peak_vus }}
